[build-system]
requires = ["setuptools>=80,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "ultron-health-ml"
version = "0.1.0"
description = "Offline synthetic telemetry foundation; no live monitoring integration"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.2,<3",
  "pandas>=2.2,<4",
  "pydantic>=2.10,<3",
  "PyYAML>=6.0,<7",
  "scikit-learn>=1.8,<1.9",
  "joblib>=1.5,<2",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "httpx>=0.28,<0.29"]
service = ["fastapi>=0.141,<0.142", "uvicorn>=0.52,<0.53"]

[tool.setuptools.package-data]
"ultron_health_ml.service" = ["approved_policy.json"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
